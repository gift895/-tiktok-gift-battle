<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Gift Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#090b14;color:#fff}
body{overflow:hidden}.game{position:relative;width:100vw;height:100vh;min-height:600px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#30344f 0,#111321 45%,#07080e 100%)}
.panel{position:absolute;top:7%;width:38%;height:70%;border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.panel:before{content:"";position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(135deg,transparent 0 24px,#fff 25px 27px)}
.girls{left:3%;background:linear-gradient(145deg,#ff3aa7,#a50073)}.boys{right:3%;background:linear-gradient(145deg,#36bfff,#0874d1)}
.team-title{position:relative;font-size:clamp(28px,4vw,62px);font-weight:1000;text-transform:uppercase;text-shadow:0 5px 0 rgba(0,0,0,.3);margin-top:4%}
.character{position:relative;font-size:clamp(100px,15vw,230px);line-height:1;margin:5% 0;text-shadow:0 14px 18px rgba(0,0,0,.28)}
.girls .character{filter:saturate(1.2)}.boys .character{filter:saturate(1.2)}
.score{position:relative;font-size:clamp(72px,10vw,160px);font-weight:1000;line-height:1;text-shadow:0 7px 0 rgba(0,0,0,.25)}
.gift{position:relative;font-size:clamp(18px,2vw,32px);font-weight:800;background:rgba(0,0,0,.2);padding:10px 20px;border-radius:99px}
.vs{position:absolute;z-index:5;left:50%;top:39%;transform:translate(-50%,-50%);width:clamp(90px,12vw,190px);height:clamp(90px,12vw,190px);border-radius:50%;background:#fff;color:#171927;display:flex;align-items:center;justify-content:center;font-size:clamp(42px,6vw,90px);font-weight:1000;border:12px solid #171927;box-shadow:0 0 0 7px #fff,0 18px 50px rgba(0,0,0,.45)}
.top{position:absolute;z-index:10;top:2%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(20px,2.4vw,38px);background:rgba(0,0,0,.35);padding:10px 22px;border-radius:999px}
.status{position:absolute;z-index:10;bottom:4%;left:50%;transform:translateX(-50%);font-size:clamp(14px,1.5vw,22px);background:rgba(0,0,0,.48);padding:10px 18px;border-radius:999px;white-space:nowrap}
.last{position:absolute;z-index:20;top:10%;left:50%;transform:translateX(-50%) scale(.8);opacity:0;background:#fff;color:#111;padding:12px 24px;border-radius:999px;font-weight:900;font-size:clamp(16px,2vw,28px);transition:.18s;pointer-events:none}
.last.show{opacity:1;transform:translateX(-50%) scale(1)}
.win{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(7px)}
.win.show{display:flex}.winbox{padding:40px 70px;border-radius:40px;background:#fff;color:#111;text-align:center;box-shadow:0 25px 100px rgba(0,0,0,.6)}
.winbox .big{font-size:clamp(42px,7vw,100px);font-weight:1000}.winbox .sub{font-size:clamp(18px,2vw,30px);font-weight:800}
.pop{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.16)}}
@media(max-width:700px){.panel{height:38%;width:78%;top:9%;left:11%!important;right:auto}.boys{top:51%}.vs{top:50%;width:80px;height:80px;border-width:7px}.status{bottom:1%}}
</style>
</head>
<body>
<div class="game">
  <div class="top">🎁 TIKTOK GIFT BATTLE</div>
  <div class="panel girls">
    <div class="team-title">Девочки</div>
    <div class="character">👧🏻💗</div>
    <div class="score" id="girlsScore">0</div>
    <div class="gift" id="girlsGift">🌹 Роза = +1</div>
  </div>
  <div class="panel boys">
    <div class="team-title">Мальчики</div>
    <div class="character">🦸🏻‍♂️⚽</div>
    <div class="score" id="boysScore">0</div>
    <div class="gift" id="boysGift">⚽ Мяч = +1</div>
  </div>
  <div class="vs">VS</div>
  <div class="last" id="last"></div>
  <div class="status" id="status">⚪ Не подключено</div>
  <div class="win" id="win"><div class="winbox"><div class="big" id="winBig"></div><div class="sub" id="winSub"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
function render(s){
  $("girlsScore").textContent=s.girls;
  $("boysScore").textContent=s.boys;
  $("girlsGift").textContent=s.girlsGiftLabel+" = +1";
  $("boysGift").textContent=s.boysGiftLabel+" = +1";
  $("status").textContent=s.connected?`🟢 LIVE подключён: @${s.username}`:"⚪ Не подключено";
  if(s.lastGift){
    const team=s.lastGift.team==="girls"?"Девочкам":"Мальчикам";
    $("last").textContent=`🎁 ${s.lastGift.userName}: ${s.lastGift.giftName} ×${s.lastGift.points} → ${team}`;
    $("last").classList.remove("show"); void $("last").offsetWidth; $("last").classList.add("show");
  }
  if(s.winner){
    $("winBig").textContent=s.winner==="girls"?"💗 ПОБЕДИЛИ ДЕВОЧКИ!":"💙 ПОБЕДИЛИ МАЛЬЧИКИ!";
    $("winSub").textContent=`Счёт ${s.girls} : ${s.boys}`;
    $("win").classList.add("show");
    setTimeout(()=>$("win").classList.remove("show"),3500);
  }
}
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.type==="state"||m.type==="gift") render(m.state);};
fetch("/api/state").then(r=>r.json()).then(render);
</script>
</body>
</html>
